name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La versión la toma de "packageManager" en package.json (no fijarla aquí
      # o pnpm/action-setup falla con "Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check-types

      - run: pnpm build
        env:
          # En CI/CD NO se usa el fichero serviceAccountKey.json (gitignored).
          # firebase-admin lee este secret con el JSON completo de la service account.
          # Configúralo en: Settings → Secrets and variables → Actions.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  # Ejemplo de despliegue del server a la VPS (adáptalo a tu método: ssh/rsync, pm2, Docker…).
  # deploy-server:
  #   needs: build
