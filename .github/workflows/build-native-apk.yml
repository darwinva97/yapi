name: Build Native APK

# Genera el APK del app NATIVA (Kotlin/Compose, com.yapi.nativeapp).
# - Bajo demanda (workflow_dispatch) y en cada tag `v*`.
# - En tags: lo adjunta a la Release de GitHub.
# - Siempre: lo sube como artifact descargable del run.
#
# No necesita Node/pnpm ni bundle de Lynx: es 100% Kotlin. Se firma con el
# mismo keystore de release (desde secretos) para que Google Sign-In funcione.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # para adjuntar el APK a la Release en tags

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Restaurar keystore de firma (estable, para que Google funcione)
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/yapi-release.keystore"

      - name: Build APK nativo (release, firmado)
        working-directory: apps/mobile/native/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/yapi-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app-native:assembleRelease --no-daemon

      - name: Renombrar APK con la versión
        id: apk
        # En tags `v*` usa la versión del tag (ej. yapi-native-v0.1.12.apk).
        # En disparo manual usa el commit corto (ej. yapi-native-dev-1a2b3c4.apk).
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            NAME="yapi-native-${{ github.ref_name }}.apk"
          else
            NAME="yapi-native-dev-${GITHUB_SHA::7}.apk"
          fi
          cp apps/mobile/native/android/app-native/build/outputs/apk/release/app-native-release.apk "$RUNNER_TEMP/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$NAME" >> "$GITHUB_OUTPUT"

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Adjuntar APK a la Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
